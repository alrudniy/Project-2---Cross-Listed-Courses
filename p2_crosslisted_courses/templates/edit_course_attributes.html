<h1>Edit Course Attributes</h1>
<form method="POST">
    <label>Attribute Code:</label> <input type="text" name="attribute_code" value="{{ course_attributes.attribute_code }}"> <br>
    <label>Attribute:</label> <input type="text" name="attribute" value="{{ course_attributes.attribute }}"> <br>
    <label>Attribute Description:</label> <input type="text" name="attribute_description" value="{{ course_attributes.attribute_description }}"> <br>
    <input type="submit" value="Save">
</form>
