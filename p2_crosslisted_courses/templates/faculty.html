<!DOCTYPE html>
<html>
  <head>
    <title>Faculty List</title>
  </head>
  <body>
    <h1>Faculty List</h1>
    <table>
      <tr>
        <th>Email</th>
        <th>Name</th>
      </tr>
      {% for faculty in faculty.html %}
      <tr>
        <td> <a href="edit_faculty/{{ faculty.faculty_email }}"> {{ faculty.faculty_email }} </a> </td>
        <td>{{ faculty.faculty_name }}</td>
      </tr>
      {% endfor %}
      

    </table>
  </body>
</html>
